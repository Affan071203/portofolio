<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#grad3)" rx="16" />

  <!-- Phone 1 (Left - Cinema Listings) -->
  <g transform="translate(140, 30)">
    <rect width="150" height="300" rx="22" fill="#09090b" stroke="#e11d48" stroke-opacity="0.5" stroke-width="2" />
    <!-- Dynamic Island / Notch -->
    <rect x="52" y="10" width="46" height="10" rx="5" fill="#27272a" />
    
    <!-- App Screen -->
    <text x="18" y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Bioskop Mobile</text>
    <text x="18" y="56" fill="#fb7185" font-family="'Segoe UI', sans-serif" font-size="8">📍 Bojonegoro (Terdekat: 1.2 km)</text>
    
    <!-- Movie Poster Card 1 -->
    <rect x="15" y="68" width="120" height="95" rx="8" fill="#27272a" />
    <rect x="22" y="76" width="48" height="78" rx="4" fill="#4c0519" />
    <text x="76" y="92" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">Interstellar</text>
    <text x="76" y="106" fill="#facc15" font-family="'Segoe UI', sans-serif" font-size="8">★ 9.4 / 10</text>
    <text x="76" y="118" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="7">Sci-Fi • 2j 49m</text>
    <rect x="76" y="128" width="52" height="18" rx="4" fill="#e11d48" />
    <text x="82" y="140" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="bold">Beli Tiket</text>

    <!-- Movie Poster Card 2 -->
    <rect x="15" y="172" width="120" height="95" rx="8" fill="#27272a" />
    <rect x="22" y="180" width="48" height="78" rx="4" fill="#1e1b4b" />
    <text x="76" y="196" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">Cyber Tech</text>
    <text x="76" y="210" fill="#facc15" font-family="'Segoe UI', sans-serif" font-size="8">★ 8.9 / 10</text>
    <text x="76" y="222" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="7">Action • 1j 55m</text>
    <rect x="76" y="232" width="52" height="18" rx="4" fill="#e11d48" />
    <text x="82" y="244" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="bold">Beli Tiket</text>
  </g>

  <!-- Phone 2 (Right - Inovasi Rating & Ulasan) -->
  <g transform="translate(310, 45)">
    <rect width="150" height="280" rx="22" fill="#09090b" stroke="#c084fc" stroke-opacity="0.5" stroke-width="2" />
    <rect x="52" y="10" width="46" height="10" rx="5" fill="#27272a" />

    <text x="18" y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Ulasan Pengguna</text>
    <text x="18" y="56" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="8">Inovasi Rating &amp; Review</text>

    <!-- Review Card 1 -->
    <rect x="15" y="68" width="120" height="85" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="28" cy="84" r="8" fill="#e11d48" />
    <text x="42" y="86" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold">Rian - Bojonegoro</text>
    <text x="42" y="96" fill="#facc15" font-family="'Segoe UI', sans-serif" font-size="7">★★★★★ 5.0</text>
    <text x="20" y="112" fill="#d4d4d8" font-family="'Segoe UI', sans-serif" font-size="7">"Fitur deteksi bioskop</text>
    <text x="20" y="123" fill="#d4d4d8" font-family="'Segoe UI', sans-serif" font-size="7">terdekatnya sangat cepat</text>
    <text x="20" y="134" fill="#d4d4d8" font-family="'Segoe UI', sans-serif" font-size="7">dan akurat!"</text>

    <!-- Review Card 2 -->
    <rect x="15" y="162" width="120" height="85" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="28" cy="178" r="8" fill="#9333ea" />
    <text x="42" y="180" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold">Siti A. - Verified</text>
    <text x="42" y="190" fill="#facc15" font-family="'Segoe UI', sans-serif" font-size="7">★★★★☆ 4.5</text>
    <text x="20" y="206" fill="#d4d4d8" font-family="'Segoe UI', sans-serif" font-size="7">"UI sangat bersih dan</text>
    <text x="20" y="217" fill="#d4d4d8" font-family="'Segoe UI', sans-serif" font-size="7">fitur bookingnya mudah."</text>
  </g>
</svg>
